name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      # ci.yml runs on push:main and pull_request, not on tags — without this
      # step a tag on an untested commit would publish silently.
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Floor, not a pin: any v2 minor from 2.16 on is accepted. 2.16 is the
          # floor because homebrew_casks replaced the removed `brews` section,
          # so older releases cannot build this config.
          version: '~> v2.16'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
